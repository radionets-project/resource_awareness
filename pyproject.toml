[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "resource_aware_ml"
dynamic = ["version"]
description = "Resource-Aware Deep Learning: Demo Package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "lightning>=2.6.1",
    "mlflow>=3.10.1",
    "natsort>=8.4.0",
    "numpy>=2.4.2",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
  "ipython>=9.4.0",
  "jupyter>=1.1.1",
  "pre-commit>=4.2.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/resource_aware_ml/_version.py"

[tool.hatch.build.targets.wheel]
include = ["src/resource_aware_ml"]

[tool.hatch.build.targets.wheel.sources]
"src/resource_aware_ml" = "resource_aware_ml"


[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = [
  "I",   # isort
  "E",   # pycodestyle
  "F",   # Pyflakes
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = ["B905", "UP038"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["resource_aware_ml"]
